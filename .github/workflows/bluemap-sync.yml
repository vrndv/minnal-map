name: BlueMap Sync

on:
  schedule:
    - cron: '0 18 * * *'   # daily 11:30 PM IST — change to your preference
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (optional)'
        required: false
        default: 'Manual trigger'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ── 1. Checkout repo ──────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ── 2. Restore mirror cache ───────────────────────────────────────────────
      - name: Restore mirror cache
        run: mkdir -p mirror

      - name: Cache mirror
        uses: actions/cache@v4
        with:
          path: mirror
          key: bluemap-mirror-${{ github.run_id }}
          restore-keys: |
            bluemap-mirror-

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: sudo apt-get install -y lftp rsync

      # ── 4. Download tarball from SFTP ─────────────────────────────────────────
      - name: Download tarball
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_REMOTE_TAR: ${{ secrets.SFTP_REMOTE_TAR }}
        run: |
          mkdir -p temp
          echo "Connecting to $SFTP_HOST:$SFTP_PORT..."
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:$SFTP_PORT" \
            -e "set sftp:auto-confirm yes; set net:timeout 60; set net:max-retries 5; get \"$SFTP_REMOTE_TAR\" -o temp/web.tar.gz; bye"
          echo "Downloaded: $(du -sh temp/web.tar.gz | cut -f1)"

      # ── 5. Verify tarball ─────────────────────────────────────────────────────
      - name: Verify tarball integrity
        run: |
          if ! gzip -t temp/web.tar.gz 2>/dev/null; then
            echo "❌ Tarball corrupt — aborting"
            exit 1
          fi
          echo "✅ Tarball OK"

      # ── 6. Extract tarball ────────────────────────────────────────────────────
      - name: Extract tarball
        run: |
          rm -rf temp/web_extracted
          mkdir -p temp/web_extracted
          tar -xzf temp/web.tar.gz --strip-components=1 -C temp/web_extracted
          echo "Contents: $(ls temp/web_extracted | tr '\n' ' ')"

      # ── 7. Diff extracted → mirror ────────────────────────────────────────────
      # mirror/ persists via cache between runs — this is where diffing happens.
      # First run: mirror is empty → copy everything, mark as changed=ALL
      # Subsequent runs: rsync --checksum finds only actual changes
      - name: Diff against mirror
        id: diff
        run: |
          mkdir -p mirror
          MIRROR_COUNT=$(find mirror -type f | wc -l)
          echo "Mirror files: $MIRROR_COUNT"

          if [[ "$MIRROR_COUNT" -eq 0 ]]; then
            echo "First run — copying everything to mirror..."
            rsync -a temp/web_extracted/ mirror/
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_count=ALL (first run)" >> $GITHUB_OUTPUT
          else
            rsync -a --checksum --delete --itemize-changes --ignore-missing-args \
              temp/web_extracted/ mirror/ > temp/rsync_log.txt 2>&1 \
              || { rc=$?; [ $rc -eq 24 ] || exit $rc; }
            cat temp/rsync_log.txt
            CHANGED=$(grep -c "^[>*]" temp/rsync_log.txt 2>/dev/null || echo 0)
            echo "Files changed: $CHANGED"
            if [[ "$CHANGED" -gt 0 ]]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "changed_count=$CHANGED" >> $GITHUB_OUTPUT
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "changed_count=0" >> $GITHUB_OUTPUT
            fi
          fi

      # ── 8. Skip if nothing changed ────────────────────────────────────────────
      - name: No changes — exit
        if: steps.diff.outputs.has_changes == 'false'
        run: |
          echo "✅ No changes since last sync. Nothing to push."

      # ── 9. Sync mirror → repo ─────────────────────────────────────────────────
      - name: Sync mirror into repo
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          rsync -a --delete --ignore-missing-args \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitattributes' \
            --exclude='my.js' \
            --exclude='custom/' \
            --exclude='server.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='node_modules/' \
            mirror/ ./ || { rc=$?; [ $rc -eq 24 ] || exit $rc; }
          echo "✔ Repo synced"
          echo "Root: $(ls | tr '\n' ' ')"

      # ── 10. Commit & push ─────────────────────────────────────────────────────
      - name: Commit and push
        if: steps.diff.outputs.has_changes == 'true'
        id: commit
        run: |
          git config user.name "BlueMap Bot"
          git config user.email "bluemap-bot@github-actions"

          # Show what git sees before staging
          echo "Git status before add:"
          git status --short | head -20

          # Stage all changes including new untracked files
          git add -A
          git status --short | head -5

          if git diff --cached --quiet; then
            echo "Git sees no changes — nothing to push"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            echo "Committing $COUNT files..."
            git diff --cached --name-only | head -20
            git commit -m "BlueMap sync — $(date +'%Y-%m-%d %H:%M:%S') — ${COUNT} file(s)"
            git push origin HEAD
            echo "pushed=true" >> $GITHUB_OUTPUT
            echo "git_changed=$COUNT" >> $GITHUB_OUTPUT
            echo "✅ Pushed $COUNT files to GitHub"
          fi

      # ── 11. Discord notification ──────────────────────────────────────────────
      - name: Discord notification
        if: steps.commit.outputs.pushed == 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          TIME_STR="$(date +'%I:%M %p')"
          DATE_STR="$(date +'%d/%m/%Y')"
          UNIX_TIME="$(date +%s)"
          CHANGED="${{ steps.commit.outputs.git_changed }}"

          HTTP=$(curl -s -o /tmp/dresp.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 BlueMap Update\",
                \"description\": \"The 3D BlueMap has been updated to the latest game world and is now live.\",
                \"color\": 5763719,
                \"fields\": [
                  { \"name\": \"🌐 Main Map\", \"value\": \"[**Launch Map**](https://varundev.tech/minnal/#world:-3788:0:-609:1423:0.05:0.01:0:0:perspective)\", \"inline\": true },
                  { \"name\": \"🛠 Backup Map\", \"value\": \"[**Backup Access**](https://minnal-bv7l.onrender.com/#world:-3788:0:-602:1115:0.13:0.02:0:0:perspective)\", \"inline\": true },
                  { \"name\": \"📁 Files Changed\", \"value\": \"${CHANGED} file(s)\", \"inline\": true },
                  { \"name\": \"🕐 Updated\", \"value\": \"<t:${UNIX_TIME}:R>\", \"inline\": true },
                  { \"name\": \"🕒 Time\", \"value\": \"${TIME_STR}\", \"inline\": true },
                  { \"name\": \"📅 Date\", \"value\": \"${DATE_STR}\", \"inline\": true }
                ],
                \"footer\": { \"text\": \"🟢 All changes are now live\" }
              }]
            }" \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages")

          if [[ "$HTTP" == "200" || "$HTTP" == "201" ]]; then
            echo "✅ Discord notification sent"
          else
            echo "⚠️ Discord failed (HTTP $HTTP):"
            cat /tmp/dresp.txt
          fi
